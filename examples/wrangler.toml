# Example wrangler.toml for a Cloudflare Pages site that hosts Events&I in ./eventsandeye.
# Copy it to your site's root and replace every example value.
name = "example-site"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-01"

[vars]
SITE_URL = "https://example.org"                     # public origin used in email links
NOTIFY_EMAIL = "events@example.org"                  # admin notifications, and the reply-to address
EMAIL_FROM = "Example Organisers <events@example.org>" # sender and calendar organiser (a domain verified in Resend)
ORG_NAME = "Example Organisers"                      # shown in emails and calendar entries
ORG_FOOTER = "Example Organisers Ltd, registered in Scotland, company number SC000000."
PRIVACY_URL = "/privacy/"                            # your privacy notice
ACCESS_TEAM_DOMAIN = "example.cloudflareaccess.com"  # Zero Trust team domain
ACCESS_AUD = "REPLACE_WITH_ACCESS_APPLICATION_AUD_TAG"
ADMIN_EMAILS = "events@example.org"                  # comma-separated; only these can use the admin page
# ACCESS_MFA = "application"                         # see the README: Cloudflare Access and two-factor sign-in
# POLL_REPLY_EMAIL = "polls@reply.example.org"       # optional: decide poll suggestions by replying (README step 12)
# Name badges on the admin page (all optional; the README's settings reference lists the sheets):
# BADGE_TEMPLATE = "avery-4822"                      # the sheet to start with (default plain-a4)
# BADGE_LOGO_URL = "/images/badge-logo.svg"          # a logo when none is chosen on the page
# BADGE_LOGO_POSITION = "auto"                       # auto, corner, top, right or left
# BADGE_TAG = "EVENT’26"                             # a short line under the logo, its colour and share of its width:
# BADGE_TAG_COLOUR = "#007CBB"
# BADGE_TAG_WIDTH = "0.64"
# BADGE_FONT_URL = "/fonts/Example-SemiBold.woff2"   # a font file on your site, and its name:
# BADGE_FONT_FAMILY = "Example SemiBold"
# BADGE_COLOUR = "#000000"                           # the names' colour, and the affiliation's:
# BADGE_AFFILIATION_COLOUR = "#007CBB"
# BADGE_ACCENT_COLOUR = "#87BD25"                    # the dots on i and j in their own colour

[[d1_databases]]
binding = "DB"
database_name = "events"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "eventsandeye/migrations"
